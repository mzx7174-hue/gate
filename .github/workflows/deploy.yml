name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # 如果你的主分支叫 master，请把 main 改成 master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # ⚠️ 注意：如果你的项目需要编译（比如Vue/React），把安装和编译命令写在这里
      # 例如： 
      # - name: Install dependencies
      #   run: npm install
      # - name: Build
      #   run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './' # ⚠️ 如果是Vue/React编译后的项目，通常改成 './dist' 或 './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
